<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pdfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1115" />
      <stop offset="100%" stop-color="#151922" />
    </linearGradient>
    <pattern id="pdfGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#252A34" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#pdfBg)" />
  <rect width="800" height="450" fill="url(#pdfGrid)" />

  <!-- Window Container -->
  <rect x="50" y="40" width="700" height="370" rx="8" fill="#151922" stroke="#252A34" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="40" rx="8" fill="#12151B" />
  <rect x="50" y="70" width="700" height="10" fill="#12151B" />
  <line x1="50" y1="80" x2="750" y2="80" stroke="#252A34" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="75" cy="60" r="4.5" fill="#F87171" opacity="0.85" />
  <circle cx="92" cy="60" r="4.5" fill="#F59E0B" opacity="0.85" />
  <circle cx="109" cy="60" r="4.5" fill="#22C55E" opacity="0.85" />
  <text x="400" y="64" text-anchor="middle" font-family="monospace" font-size="12" fill="#737A89">tigerpdf.vercel.app</text>

  <!-- Inner Content -->
  <!-- Left PDF Utility Preview -->
  <g transform="translate(90, 115)">
    <rect x="0" y="0" width="170" height="240" rx="6" fill="#1B202A" stroke="#252A34" stroke-width="1.5" />
    <!-- PDF File Tag -->
    <rect x="20" y="20" width="46" height="22" rx="4" fill="#F59E0B" />
    <text x="43" y="35" text-anchor="middle" font-family="monospace" font-weight="700" font-size="11" fill="#0F1115">PDF</text>
    <rect x="74" y="24" width="76" height="6" rx="2" fill="#E8EAF0" />
    <rect x="74" y="34" width="50" height="5" rx="1.5" fill="#737A89" />

    <!-- File processing block -->
    <rect x="20" y="60" width="130" height="70" rx="4" fill="#12151B" stroke="#252A34" stroke-width="1" />
    <text x="32" y="82" font-family="monospace" font-size="11" fill="#A7ACB8">merge_files()</text>
    <text x="32" y="100" font-family="monospace" font-size="10" fill="#22C55E">✓ 3 PDFs merged</text>
    <text x="32" y="118" font-family="monospace" font-size="10" fill="#737A89">size: 1.4 MB</text>

    <!-- Compress block -->
    <rect x="20" y="145" width="130" height="75" rx="4" fill="#12151B" stroke="#252A34" stroke-width="1" />
    <text x="32" y="167" font-family="monospace" font-size="11" fill="#A7ACB8">compress()</text>
    <text x="32" y="186" font-family="monospace" font-size="11" font-weight="600" fill="#F59E0B">-64% Redux</text>
    <text x="32" y="204" font-family="monospace" font-size="10" fill="#22C55E">✓ Ready for download</text>
  </g>

  <!-- Right Side: Details & Tools -->
  <g transform="translate(295, 120)">
    <text x="0" y="24" font-family="sans-serif" font-weight="700" font-size="24" fill="#E8EAF0">TigerPDF</text>
    <text x="0" y="48" font-family="sans-serif" font-size="13" fill="#A7ACB8">Full-Stack PDF &amp; Image Utility Web Application</text>

    <!-- Tool Boxes -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="125" height="56" rx="6" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#737A89">CONVERT</text>
      <text x="14" y="44" font-family="monospace" font-size="13" font-weight="600" fill="#F59E0B">IMG to PDF</text>

      <rect x="140" y="0" width="125" height="56" rx="6" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="154" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#737A89">MERGE</text>
      <text x="154" y="44" font-family="monospace" font-size="13" font-weight="600" fill="#E8EAF0">Multi-PDF</text>

      <rect x="280" y="0" width="125" height="56" rx="6" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="294" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#737A89">OPTIMIZE</text>
      <text x="294" y="44" font-family="monospace" font-size="13" font-weight="600" fill="#22C55E">Stream Compress</text>
    </g>

    <!-- Tech Stack Row -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="65" height="26" rx="4" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="32.5" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#A7ACB8">React</text>

      <rect x="75" y="0" width="75" height="26" rx="4" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="112.5" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#A7ACB8">Node.js</text>

      <rect x="160" y="0" width="75" height="26" rx="4" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="197.5" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#A7ACB8">Express</text>

      <rect x="245" y="0" width="85" height="26" rx="4" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="287.5" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#A7ACB8">REST APIs</text>
    </g>
  </g>
</svg>
