<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e13" />
      <stop offset="100%" stop-color="#14141c" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191923" />
      <stop offset="100%" stop-color="#121219" />
    </linearGradient>
    <linearGradient id="resumeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#242432" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" />
  <rect width="800" height="450" fill="url(#grid2)" />

  <!-- Subtle glow -->
  <circle cx="400" cy="200" r="180" fill="#a855f7" opacity="0.07" filter="blur(40px)" />

  <!-- Window Container -->
  <rect x="60" y="45" width="680" height="360" rx="12" fill="url(#cardGrad2)" stroke="#262636" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="45" width="680" height="42" rx="12" fill="#171720" />
  <rect x="60" y="75" width="680" height="12" fill="#171720" />
  <line x1="60" y1="87" x2="740" y2="87" stroke="#262636" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="84" cy="66" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="102" cy="66" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="120" cy="66" r="5" fill="#10b981" opacity="0.8" />
  <text x="400" y="70" text-anchor="middle" font-family="monospace" font-size="12" fill="#71717a">tigerresume.app - builder</text>

  <!-- Inner Content -->
  <!-- Resume Layout Icon -->
  <g transform="translate(110, 130)">
    <rect x="0" y="0" width="70" height="85" rx="8" fill="#1e1e2c" stroke="#a855f7" stroke-width="1.5" />
    <!-- Avatar circle -->
    <circle cx="24" cy="24" r="8" fill="#a855f7" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.2" />
    <!-- Mini lines -->
    <line x1="38" y1="20" x2="56" y2="20" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
    <line x1="38" y1="28" x2="50" y2="28" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="42" x2="56" y2="42" stroke="#52525b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="52" x2="56" y2="52" stroke="#52525b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="62" x2="44" y2="62" stroke="#52525b" stroke-width="1.5" stroke-linecap="round" />
    <rect x="14" y="69" width="22" height="6" rx="2" fill="#6366f1" />
  </g>

  <!-- Project Title & Description -->
  <text x="210" y="160" font-family="sans-serif" font-weight="700" font-size="28" fill="#f4f4f5">TigerResume</text>
  <text x="210" y="190" font-family="sans-serif" font-size="14" fill="#a1a1aa">Full-Stack Resume Builder with Customizable Templates</text>

  <!-- Features Grid -->
  <g transform="translate(110, 245)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="165" height="52" rx="8" fill="#161622" stroke="#262636" stroke-width="1" />
    <circle cx="22" cy="26" r="10" fill="#222234" />
    <path d="M18 26 L21 29 L26 23" stroke="#10b981" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <text x="40" y="24" font-family="sans-serif" font-weight="600" font-size="12" fill="#e4e4e7">Templates</text>
    <text x="40" y="38" font-family="sans-serif" font-size="10" fill="#71717a">Customizable UI</text>

    <!-- Feature 2 -->
    <rect x="185" y="0" width="165" height="52" rx="8" fill="#161622" stroke="#262636" stroke-width="1" />
    <circle cx="207" cy="26" r="10" fill="#222234" />
    <path d="M203 26 L206 29 L211 23" stroke="#10b981" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <text x="225" y="24" font-family="sans-serif" font-weight="600" font-size="12" fill="#e4e4e7">Express APIs</text>
    <text x="225" y="38" font-family="sans-serif" font-size="10" fill="#71717a">Data Endpoints</text>

    <!-- Feature 3 -->
    <rect x="370" y="0" width="165" height="52" rx="8" fill="#161622" stroke="#262636" stroke-width="1" />
    <circle cx="392" cy="26" r="10" fill="#222234" />
    <path d="M388 26 L391 29 L396 23" stroke="#10b981" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <text x="410" y="24" font-family="sans-serif" font-weight="600" font-size="12" fill="#e4e4e7">MongoDB</text>
    <text x="410" y="38" font-family="sans-serif" font-size="10" fill="#71717a">Cloud Storage</text>
  </g>

  <!-- Bottom Tech Tags -->
  <g transform="translate(110, 325)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="0.8" />
    <text x="35" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#818cf8">React.js</text>

    <rect x="80" y="0" width="70" height="24" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="0.8" />
    <text x="115" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#818cf8">Next.js</text>

    <rect x="160" y="0" width="80" height="24" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="0.8" />
    <text x="200" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#818cf8">Express.js</text>

    <rect x="250" y="0" width="80" height="24" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="0.8" />
    <text x="290" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#818cf8">MongoDB</text>
  </g>
</svg>
