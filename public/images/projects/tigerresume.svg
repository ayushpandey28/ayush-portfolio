<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="trBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1115" />
      <stop offset="100%" stop-color="#151922" />
    </linearGradient>
    <pattern id="trGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#252A34" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#trBg)" />
  <rect width="800" height="450" fill="url(#trGrid)" />

  <!-- Window Container -->
  <rect x="50" y="40" width="700" height="370" rx="8" fill="#151922" stroke="#252A34" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="40" rx="8" fill="#12151B" />
  <rect x="50" y="70" width="700" height="10" fill="#12151B" />
  <line x1="50" y1="80" x2="750" y2="80" stroke="#252A34" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="75" cy="60" r="4.5" fill="#F87171" opacity="0.85" />
  <circle cx="92" cy="60" r="4.5" fill="#F59E0B" opacity="0.85" />
  <circle cx="109" cy="60" r="4.5" fill="#22C55E" opacity="0.85" />
  <text x="400" y="64" text-anchor="middle" font-family="monospace" font-size="12" fill="#737A89">tiger-resume.vercel.app</text>

  <!-- Main Showcase Layout -->
  <!-- Left Resume Document Preview -->
  <g transform="translate(90, 115)">
    <rect x="0" y="0" width="170" height="240" rx="6" fill="#1B202A" stroke="#252A34" stroke-width="1.5" />
    <!-- Top accent bar on doc -->
    <rect x="15" y="15" width="140" height="4" rx="2" fill="#F59E0B" />
    <!-- Candidate name line -->
    <rect x="15" y="28" width="80" height="8" rx="2" fill="#E8EAF0" />
    <rect x="15" y="42" width="110" height="5" rx="1.5" fill="#737A89" />
    <!-- Divider -->
    <line x1="15" y1="56" x2="155" y2="56" stroke="#252A34" stroke-width="1" />
    <!-- Section 1 -->
    <rect x="15" y="66" width="50" height="6" rx="1.5" fill="#F59E0B" opacity="0.9" />
    <rect x="15" y="78" width="135" height="4" rx="1" fill="#A7ACB8" />
    <rect x="15" y="86" width="125" height="4" rx="1" fill="#737A89" />
    <rect x="15" y="94" width="110" height="4" rx="1" fill="#737A89" />
    <!-- Section 2 -->
    <rect x="15" y="110" width="60" height="6" rx="1.5" fill="#F59E0B" opacity="0.9" />
    <rect x="15" y="122" width="140" height="4" rx="1" fill="#A7ACB8" />
    <rect x="15" y="130" width="130" height="4" rx="1" fill="#737A89" />
    <rect x="15" y="138" width="120" height="4" rx="1" fill="#737A89" />
    <!-- Score badge -->
    <rect x="15" y="185" width="140" height="38" rx="4" fill="#12151B" stroke="#252A34" stroke-width="1" />
    <text x="25" y="208" font-family="monospace" font-size="11" font-weight="600" fill="#22C55E">ATS MATCH: 94%</text>
  </g>

  <!-- Right Side: Details & Analysis -->
  <g transform="translate(295, 120)">
    <text x="0" y="24" font-family="sans-serif" font-weight="700" font-size="24" fill="#E8EAF0">TigerResume</text>
    <text x="0" y="48" font-family="sans-serif" font-size="13" fill="#A7ACB8">AI Resume Analysis &amp; ATS Optimization Platform</text>

    <!-- Metrics Cards -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="125" height="56" rx="6" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#737A89">PARSING</text>
      <text x="14" y="44" font-family="monospace" font-size="13" font-weight="600" fill="#F59E0B">PDF / Realtime</text>

      <rect x="140" y="0" width="125" height="56" rx="6" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="154" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#737A89">STORAGE</text>
      <text x="154" y="44" font-family="monospace" font-size="13" font-weight="600" fill="#E8EAF0">MongoDB Cloud</text>

      <rect x="280" y="0" width="125" height="56" rx="6" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="294" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#737A89">TEMPLATES</text>
      <text x="294" y="44" font-family="monospace" font-size="13" font-weight="600" fill="#22C55E">3 Formats</text>
    </g>

    <!-- Tech Stack Row -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="65" height="26" rx="4" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="32.5" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#A7ACB8">React</text>

      <rect x="75" y="0" width="75" height="26" rx="4" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="112.5" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#A7ACB8">Node.js</text>

      <rect x="160" y="0" width="75" height="26" rx="4" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="197.5" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#A7ACB8">Express</text>

      <rect x="245" y="0" width="85" height="26" rx="4" fill="#1B202A" stroke="#252A34" stroke-width="1" />
      <text x="287.5" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#A7ACB8">MongoDB</text>
    </g>
  </g>
</svg>
